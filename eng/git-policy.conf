# Nexali Git governance policy. Bash syntax; sourced by versioned hooks and tools.
NEXALI_PROTECTED_BRANCHES=(main testing develop)
NEXALI_BRANCH_TYPES=(feature fix refactor test docs security perf build ci chore release)
NEXALI_BRANCH_NAME_REGEX='^(feature|fix|refactor|test|docs|security|perf|build|ci|chore|release)/[a-z0-9]+(-[a-z0-9]+)*$'
