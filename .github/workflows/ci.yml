name: CI

on:
  pull_request:
    branches:
      - develop
      - testing
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - develop
      - testing
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  pr-source-chain:
    name: PR source chain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate pull-request source chain
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          NEXALI_PR_SOURCE: ${{ github.head_ref }}
          NEXALI_PR_TARGET: ${{ github.base_ref }}
        run: ./scripts/validate-pr-source.sh "$NEXALI_PR_SOURCE" "$NEXALI_PR_TARGET"

      - name: Protected-branch push
        if: github.event_name != 'pull_request'
        shell: bash
        run: echo "PR source-chain validation is not applicable to protected-branch push/workflow_dispatch events."

  repository-gate:
    name: Repository gate
    needs:
      - pr-source-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXALI_CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Show toolchain
        shell: bash
        run: |
          dotnet --version
          python3 --version

      - name: Validate repository
        shell: bash
        run: ./scripts/validate-repository.sh
