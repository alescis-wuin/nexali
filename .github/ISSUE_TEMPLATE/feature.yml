name: Feature request
description: Propose a product or engineering improvement.
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or architectural impact
      description: Security, E2EE, accessibility, reliability, compatibility, or migration concerns.
